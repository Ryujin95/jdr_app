nelmio_cors:
  defaults:
    allow_credentials: false
    allow_origin:
      - '%env(CORS_ALLOW_ORIGIN_REGEX)%'
    origin_regex: true
    allow_headers:
      - 'Content-Type'
      - 'Authorization'
    allow_methods:
      - 'GET'
      - 'POST'
      - 'PUT'
      - 'PATCH'   # <— ajouté
      - 'DELETE'
      - 'OPTIONS'
    max_age: 3600

  paths:
    '^/':
      allow_origin:
        - '%env(CORS_ALLOW_ORIGIN_REGEX)%'
      origin_regex: true
      allow_headers:
        - 'Content-Type'
        - 'Authorization'
      allow_methods:
        - 'GET'
        - 'POST'
        - 'PUT'
        - 'PATCH'   # <— ajouté ici aussi
        - 'DELETE'
        - 'OPTIONS'
      max_age: 3600
