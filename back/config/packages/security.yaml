# config/packages/security.yaml
security:
  password_hashers:
    App\Entity\User: 'auto'

  providers:
    app_user_provider:
      id: App\Security\AppUserProvider

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    api:
      pattern: ^/api
      stateless: true
      provider: app_user_provider
      user_checker: App\Security\ActiveUserChecker

      json_login:
        check_path: /api/login_check
        username_path: email
        password_path: password
        success_handler: lexik_jwt_authentication.handler.authentication_success
        failure_handler: lexik_jwt_authentication.handler.authentication_failure

      jwt: ~

    main:
      lazy: true
      provider: app_user_provider

  access_control:
    - { path: ^/api/login_check, roles: PUBLIC_ACCESS }

    - { path: ^/api/auth/reset-password-info$, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/reset-password$, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/forgot-password$, roles: PUBLIC_ACCESS }

    # Seule l'inscription est publique. Les autres routes /api/users sont
    # couvertes par les règles authentifiées ci-dessous.
    - { path: ^/api/users$, roles: PUBLIC_ACCESS, methods: [POST] }
    - { path: ^/api/users$, roles: ROLE_ADMIN, methods: [GET] }
    - { path: ^/api/users/\d+$, roles: IS_AUTHENTICATED_FULLY, methods: [GET, PUT] }

    # Optionnel mais clair: la corbeille nécessite juste d'être connecté
    - { path: ^/api/trash, roles: IS_AUTHENTICATED_FULLY }

    # Tout le reste de l'API nécessite d'être connecté
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

  role_hierarchy:
    ROLE_MJ: [ROLE_USER]
    ROLE_ADMIN: [ROLE_MJ, ROLE_USER]
